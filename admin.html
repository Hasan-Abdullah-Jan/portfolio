<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Hasan Abdullah Jan</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="blog.css">
</head>
<body>
  <header class="blog-nav">
    <div class="container blog-nav__inner">
      <a href="index.html" class="nav__logo" aria-label="Home"><span class="nav__logo-accent">&lt;</span>HAJ<span class="nav__logo-accent"> /&gt;</span></a>
      <nav class="blog-nav__links">
        <a href="blog.html">View blog</a>
        <button class="link-btn hidden" id="logout">Log out</button>
        <button class="nav__icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Login -->
  <form class="login-card hidden" id="login-view" autocomplete="on">
    <h1>Admin login</h1>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <p class="msg err" id="login-msg"></p>
    <button class="btn btn--primary" type="submit">Log in</button>
  </form>

  <!-- Post list -->
  <main class="admin-wrap hidden" id="list-view">
    <div class="admin-bar">
      <h1>Posts</h1>
      <button class="btn btn--primary" id="new-post">New post</button>
    </div>
    <p class="msg" id="list-msg"></p>
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Status</th><th>Updated</th><th></th></tr></thead>
      <tbody id="post-rows"></tbody>
    </table>

    <div class="admin-bar" style="margin-top: var(--space-16);">
      <h1>Comments <span class="badge hidden" id="pending-badge"></span></h1>
    </div>
    <p class="msg" id="comments-msg"></p>
    <table class="admin-table">
      <thead><tr><th>Comment</th><th>Post</th><th>Status</th><th></th></tr></thead>
      <tbody id="comment-rows"></tbody>
    </table>
  </main>

  <!-- Editor -->
  <main class="admin-wrap hidden" id="edit-view">
    <div class="admin-bar">
      <h1 id="edit-heading">New post</h1>
      <div class="admin-actions">
        <button class="btn btn--secondary" id="back">← Back</button>
        <label class="check"><input type="checkbox" id="f-published"> Published</label>
        <button class="btn btn--primary" id="save">Save</button>
      </div>
    </div>
    <p class="msg" id="edit-msg"></p>

    <div class="row">
      <div class="field"><label for="f-title">Title</label><input id="f-title" maxlength="150"></div>
      <div class="field"><label for="f-slug">Slug (URL)</label><input id="f-slug" maxlength="100"><small>Letters, numbers and dashes. Locked after the first save.</small></div>
    </div>
    <div class="field"><label for="f-excerpt">Excerpt</label><input id="f-excerpt" maxlength="300"><small>Short summary shown on the blog list and in search results.</small></div>
    <div class="row">
      <div class="field"><label for="f-tags">Tags</label><input id="f-tags" placeholder="ai, automation"><small>Comma separated.</small></div>
      <div class="field">
        <label for="f-cover">Cover image URL</label>
        <input id="f-cover" placeholder="https://…">
        <small><button type="button" class="link-btn" id="upload-cover" style="padding:0">Upload image</button></small>
      </div>
    </div>

    <div class="toolbar">
      <button type="button" data-md="**|**">Bold</button>
      <button type="button" data-md="*|*">Italic</button>
      <button type="button" data-md="## |">Heading</button>
      <button type="button" data-md="[|](https://)">Link</button>
      <button type="button" data-md="`|`">Code</button>
      <button type="button" data-md="- |">List</button>
      <button type="button" data-md="> |">Quote</button>
      <button type="button" id="upload-inline">Insert image</button>
    </div>
    <div class="editor-grid">
      <div class="field"><textarea id="f-content" placeholder="Write in Markdown…"></textarea></div>
      <div class="preview"><div class="prose" id="preview"></div></div>
    </div>
    <input type="file" id="file" accept="image/*" class="hidden">
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
